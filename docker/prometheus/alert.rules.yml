groups:
  - name: mithaq_alerts
    rules:
      # 1. Indexer Lag Alert
      - alert: IndexerLagHigh
        expr: mithaq_indexer_ledgers_behind > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Indexer lagging behind ledger head"
          description: "The indexer is currently {{ $value }} ledgers behind head (threshold: > 10 ledgers)."

      # 2. Issuance Failure Rate Alert
      - alert: HighIssuanceFailureRate
        expr: (sum(rate(mithaq_issuance_failures_total[5m])) / sum(rate(mithaq_issuance_attempts_total[5m]))) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High credential issuance failure rate"
          description: "Credential issuance failure rate is {{ $value | humanizePercentage }} over the last 5 minutes (threshold: > 5%)."

      # 3. API Readiness Failure Alert
      - alert: APIReadyFailing
        expr: mithaq_api_ready_status == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Mithaq API readiness check failing"
          description: "The /api/ready endpoint has returned non-200 or unhealthy status for > 1 minute."

      # 4. Security Violation Alert: Demo Key in Production
      - alert: DemoIssuerKeyActiveInProduction
        expr: mithaq_demo_issuer_mode{env="production"} == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "SECURITY VIOLATION: Demo issuer key active in production"
          description: "Production environment is currently configured with the hardcoded demo issuer key."

      # 5. Persistent Webhook Delivery Failures (issue API-17)
      - alert: WebhookDeliveryExhausted
        expr: indexer_webhook_subscriptions_exhausted > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Webhook subscriptions with exhausted retries"
          description: >
            {{ $value }} webhook subscription(s) have exhausted all delivery
            attempts without a successful response. This can indicate a
            persistent destination outage. Check the subscription's last_error
            field via GET /webhooks/subscriptions/:id/deliveries to distinguish
            a network/HTTP failure (destination outage) from a signature
            rejection (misconfigured WEBHOOK_SIGNING_SECRET). No secret material
            is logged — the last_error field contains only the HTTP status code
            or connection error message.

      # 6. Webhook Delivery Failure Rate (issue API-17)
      - alert: WebhookDeliveryFailureRateHigh
        expr: >
          rate(indexer_webhook_deliveries_failure_total[10m])
          /
          (rate(indexer_webhook_deliveries_success_total[10m]) + rate(indexer_webhook_deliveries_failure_total[10m]))
          > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High webhook delivery failure rate"
          description: >
            More than 50% of webhook delivery attempts have failed over the
            last 10 minutes. Inspect delivery errors via
            GET /webhooks/subscriptions/:id/deliveries?outcome=failed.
            No signing secrets are exposed in error responses.
